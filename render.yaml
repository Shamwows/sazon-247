# Render Blueprint — Sazón 24/7 static site
# Dashboard: New → Blueprint → connect Shamwows/sazon-247
# Or: New → Static Site → this repo (settings below)
services:
  - type: web
    name: sazon-247
    runtime: static
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: "echo Static site ready"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
