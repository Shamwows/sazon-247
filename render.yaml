# Render Blueprint — static site for Sazón 24/7
# https://dashboard.render.com → New → Blueprint → connect this repo
services:
  - type: web
    name: sazon-247
    runtime: static
    # Pure HTML/CSS/JS — no build step
    buildCommand: "echo Static site ready"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
